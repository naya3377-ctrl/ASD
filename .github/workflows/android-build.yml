name: Android build (HWP 편집기)

on:
  workflow_dispatch:
  push:
    paths:
      - 'hwp-android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'hwp-android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hwp-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 문서 처리 엔진 시험 (hwp/hwpx 열기·고치기·저장)
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: 앱 화면 시험 (가상 안드로이드)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: APK 만들기
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: APK 이름 정리
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/HWP-Editor-${version}.apk"
          ls -la dist

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: HWP-Editor-APK
          path: hwp-android/dist/*.apk
          if-no-files-found: error

      - name: 시험 결과 올리기 (실패했을 때)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            hwp-android/core/build/reports/tests/
            hwp-android/app/build/reports/tests/
          if-no-files-found: ignore
