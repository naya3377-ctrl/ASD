name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Test actual PDF edits
        run: python -m unittest tests.test_document -v
      - name: Build app
        run: python -m PyInstaller --noconfirm YoonDF.spec
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          & $compiler packaging\windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: YoonDF-Windows-0.9.18
          path: dist/installer/*.exe
      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: YoonDF-Windows-portable-0.9.18
          path: dist/YoonDF/

  # The offline installer people actually install (packaging/CROSS_BUILD.md):
  # CPython's embeddable runtime, official Windows wheels and bundled OCR data,
  # packed with NSIS on Linux. Every input is checked against
  # packaging/windows-input-sha256.json before it goes in.
  offline-installer:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Work outside the checkout
        # The payload carries a copy of the source, so it cannot sit inside it.
        run: |
          echo "DOWNLOADS=$RUNNER_TEMP/downloads" >> "$GITHUB_ENV"
          echo "PAYLOAD=$RUNNER_TEMP/payload" >> "$GITHUB_ENV"
          echo "OUTPUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
      - name: Download pinned Windows inputs
        run: |
          mkdir -p "$DOWNLOADS/licenses"
          python -m pip download --dest "$DOWNLOADS" --no-deps --only-binary=:all: --platform win_amd64 --python-version 312 --implementation cp --abi cp312 PySide6-Essentials==6.8.3 shiboken6==6.8.3 PyMuPDF==1.26.6
          python -m pip download --dest "$DOWNLOADS" --no-deps --only-binary=:all: --platform any --python-version 312 --implementation py --abi none fonttools==4.61.1
          curl -fsSL -o "$DOWNLOADS/python-3.12.10-embed-amd64.zip" https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          for name in LGPL-3.0-only.txt GPL-3.0-only.txt Qt-GPL-exception-1.0.txt; do
            curl -fsSL -o "$DOWNLOADS/licenses/$name" "https://raw.githubusercontent.com/qt/qtbase/v6.8.3/LICENSES/$name"
          done
      - name: Check inputs against pinned hashes
        shell: python
        run: |
          import hashlib, json, os, pathlib, sys
          bad = []
          for name, digest in json.loads(pathlib.Path("packaging/windows-input-sha256.json").read_text()).items():
              path = pathlib.Path(name) if name.startswith("tessdata/") else pathlib.Path(os.environ["DOWNLOADS"]) / name
              if not path.exists() or hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  bad.append(name)
          print("mismatch:", bad) if bad else print("all inputs match")
          sys.exit(1 if bad else 0)
      - name: Install build tools
        run: |
          python -m pip install ziglang==0.16.0
          sudo apt-get update -q && sudo apt-get install -y -q nsis
      - name: Assemble and pack
        run: |
          python packaging/assemble_windows.py "$DOWNLOADS" "$PAYLOAD"
          cd packaging
          python -m ziglang rc /fo "$RUNNER_TEMP/launcher.res" launcher.rc
          python -m ziglang cc -target x86_64-windows-gnu -O2 -municode -Wl,--subsystem,windows launcher.c "$RUNNER_TEMP/launcher.res" -o "$PAYLOAD/YoonDF.exe"
          python -m ziglang cc -target x86_64-windows-gnu -O2 -municode -Wl,--subsystem,windows python_host.c "$RUNNER_TEMP/launcher.res" -lshell32 -o "$PAYLOAD/runtime/YoonDF.exe"
          rm -f "$PAYLOAD"/*.pdb "$PAYLOAD"/runtime/*.pdb
          mkdir -p "$OUTPUT"
          makensis -V2 -DPAYLOAD="$PAYLOAD" -DOUTPUT="$OUTPUT/YoonDF-Setup-0.9.18-x64.exe" windows-cross.nsi
      - name: Upload offline installer
        uses: actions/upload-artifact@v4
        with:
          name: YoonDF-Setup-0.9.18-x64
          path: ${{ runner.temp }}/out/YoonDF-Setup-0.9.18-x64.exe
          compression-level: 0
